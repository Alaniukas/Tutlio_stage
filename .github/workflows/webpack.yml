name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x, 24.x]

    steps:
    - uses: actions/checkout@v4

    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: npm

    - name: Install
      run: npm ci

    # `npm run build` is esbuild-only and does not typecheck, so a type error
    # would otherwise ship silently. Both tsconfigs are checked: the SPA
    # (src/) and the serverless functions (api/).
    - name: Typecheck
      run: |
        npm run lint
        npm run lint:api

    # tests/lib/i18n-coverage.test.ts is the gate that stops en/lt-only
    # translation keys reaching production as visible fallback text.
    - name: Test
      run: npm test

    - name: Verify auth email templates
      run: npm run locales:auth-templates -- --check

    - name: Verify locale runtime arguments
      run: npm run locales:audit -- --check

    - name: Build
      run: npm run build
