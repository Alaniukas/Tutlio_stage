<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!-- Prefer real Times New Roman / metric-compatible Liberation Serif over DejaVu,
     which reflows school contract templates and changes page breaks. -->
<fontconfig>
  <alias binding="strong">
    <family>Times New Roman</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
      <family>DejaVu Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>TimesNewRoman</family>
    <prefer>
      <family>Times New Roman</family>
      <family>Liberation Serif</family>
    </prefer>
  </alias>
  <alias binding="strong">
    <family>Arial</family>
    <prefer>
      <family>Arial</family>
      <family>Liberation Sans</family>
      <family>DejaVu Sans</family>
    </prefer>
  </alias>
</fontconfig>
